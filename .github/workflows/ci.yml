name: ShelfSync CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  mobile:
    name: Mobile checks
    runs-on: ubuntu-latest

    env:
      EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:4000

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Run mobile tests
        run: npm test

      - name: Run mobile lint
        run: npm run lint

      - name: Check mobile TypeScript
        run: npx tsc --noEmit

  backend:
    name: Backend checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    env:
      DATABASE_URL: postgresql://shelfsync:shelfsync@localhost:5432/shelfsync

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check backend TypeScript
        run: npx tsc --noEmit